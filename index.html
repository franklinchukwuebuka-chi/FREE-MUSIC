<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulse — Music &amp; Videos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#08080f;
    --card:rgba(255,255,255,.055);
    --card-hover:rgba(255,255,255,.10);
    --border:rgba(255,255,255,.10);
    --text:#eef0f7;
    --muted:#9aa0b5;
    --accent:#7c5cff;
    --accent2:#ff4d8d;
    --radius:16px;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    min-height:100vh;
    padding-bottom:120px;
    background:
      radial-gradient(1100px 600px at 8% -10%, rgba(124,92,255,.35) 0%, transparent 60%),
      radial-gradient(900px 520px at 95% 0%, rgba(255,77,141,.22) 0%, transparent 55%),
      radial-gradient(800px 600px at 50% 110%, rgba(46,196,182,.14) 0%, transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  ::selection{background:var(--accent);color:#fff}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:14px clamp(16px,4vw,40px);
    background:rgba(8,8,15,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:1.25rem; letter-spacing:.5px;
    margin-right:auto;
  }
  .logo-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;
    box-shadow:0 6px 20px rgba(124,92,255,.5);
  }
  .logo-mark svg{width:20px;height:20px;fill:#fff}
  .logo span{background:linear-gradient(90deg,#fff,#b9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}

  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:999px;border:1px solid var(--border)}
  .tab{
    border:0; cursor:pointer; font:inherit; font-weight:600; font-size:.9rem;
    color:var(--muted); background:transparent;
    padding:8px 20px; border-radius:999px; transition:.25s;
  }
  .tab:hover{color:var(--text)}
  .tab.active{
    color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 4px 16px rgba(124,92,255,.45);
  }

  .search{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:12px;width:17px;height:17px;fill:var(--muted);pointer-events:none}
  .search input{
    font:inherit; font-size:.9rem; color:var(--text);
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
    border-radius:999px;
    padding:10px 16px 10px 38px;
    width:230px; outline:none; transition:.25s;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{
    border-color:var(--accent);
    background:rgba(124,92,255,.12);
    box-shadow:0 0 0 4px rgba(124,92,255,.16);
    width:280px;
  }

  /* ---------- Layout ---------- */
  main{padding:clamp(20px,3.5vw,38px)}
  .panel{display:none; animation:fade .45s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .section-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .section-head h2{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.5px}
  .section-head p{color:var(--muted);font-size:.9rem;padding-bottom:4px}
  .pill{
    font-size:.72rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    padding:5px 12px;border-radius:999px;color:#d9d0ff;
    background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.35);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
    gap:20px;
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px;
    cursor:pointer;
    transition:transform .3s cubic-bezier(.2,.8,.3,1), background .3s, border-color .3s, box-shadow .3s;
    position:relative;
    overflow:hidden;
  }
  .card:hover{
    transform:translateY(-6px);
    background:var(--card-hover);
    border-color:rgba(124,92,255,.45);
    box-shadow:0 18px 40px -14px rgba(0,0,0,.75), 0 0 0 1px rgba(124,92,255,.15);
  }
  .card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 16px 36px -16px rgba(124,92,255,.85)}
  .card.active h3{color:#c3b2ff}

  .cover{
    position:relative;
    aspect-ratio:1/1;
    border-radius:12px;
    display:grid; place-items:center;
    font-size:2.6rem;
    overflow:hidden;
    margin-bottom:12px;
    box-shadow:inset 0 0 60px rgba(0,0,0,.35);
  }
  .cover::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 45%);
    pointer-events:none;
  }
  .play-btn{
    position:absolute; right:10px; bottom:10px;
    width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    display:grid;place-items:center;
    background:#fff; color:#111;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
    opacity:0; transform:translateY(10px) scale(.85);
    transition:.3s cubic-bezier(.2,.8,.3,1);
  }
  .play-btn svg{width:20px;height:20px;fill:currentColor}
  .card:hover .play-btn{opacity:1;transform:translateY(0) scale(1)}
  .card.active .play-btn{opacity:1;transform:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .play-btn:hover{transform:scale(1.1)!important}

  .card h3{font-size:.95rem;font-weight:650;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card p{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* video cards */
  .v-card .thumb{
    position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden;
    margin-bottom:12px; display:grid; place-items:center; font-size:2.4rem;
    box-shadow:inset 0 0 60px rgba(0,0,0,.35);
  }
  .v-card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .v-card:hover .thumb img{transform:scale(1.07)}
  .badge{
    position:absolute;right:8px;bottom:8px;z-index:2;
    font-size:.72rem;font-weight:700;
    background:rgba(0,0,0,.78);padding:3px 8px;border-radius:6px;letter-spacing:.4px;
  }
  .thumb .play-overlay{
    position:absolute;inset:0;z-index:2;display:grid;place-items:center;
    background:rgba(8,8,15,.35);opacity:0;transition:.3s;
  }
  .v-card:hover .play-overlay{opacity:1}
  .thumb .play-overlay div{
    width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;box-shadow:0 10px 30px rgba(124,92,255,.6);
    transform:scale(.85);transition:.3s;
  }
  .v-card:hover .play-overlay div{transform:scale(1)}
  .play-overlay svg{width:22px;height:22px;fill:#fff;margin-left:3px}
  .v-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
  .tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#b9a8ff;background:rgba(124,92,255,.16);padding:3px 8px;border-radius:6px}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;font-size:.95rem}

  /* ---------- Player bar ---------- */
  .player{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,2.1fr) minmax(0,1fr);
    align-items:center; gap:18px;
    padding:12px clamp(14px,3vw,28px);
    background:rgba(12,12,20,.82);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border-top:1px solid var(--border);
    transform:translateY(105%);
    transition:transform .45s cubic-bezier(.2,.8,.3,1);
  }
  .player.show{transform:none}

  .now{display:flex;align-items:center;gap:12px;min-width:0}
  .now .art{
    width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;
    font-size:1.4rem;box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  .now-info{min-width:0}
  .now-info h4{font-size:.9rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now-info span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

  .eq{display:flex;align-items:flex-end;gap:2.5px;height:14px;flex:none}
  .eq i{width:3px;height:4px;border-radius:2px;background:linear-gradient(180deg,var(--accent2),var(--accent));display:block}
  .player.playing .eq i{animation:eq .9s ease-in-out infinite}
  .player.playing .eq i:nth-child(2){animation-delay:.15s}
  .player.playing .eq i:nth-child(3){animation-delay:.3s}
  .player.playing .eq i:nth-child(4){animation-delay:.45s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}

  .center{display:flex;flex-direction:column;gap:7px;min-width:0}
  .controls{display:flex;align-items:center;justify-content:center;gap:8px}
  .ctrl{
    border:0;background:transparent;cursor:pointer;color:var(--muted);
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:.22s;
  }
  .ctrl svg{width:19px;height:19px;fill:currentColor}
  .ctrl:hover{color:#fff;background:rgba(255,255,255,.08)}
  .ctrl.on{color:var(--accent2)}
  .ctrl.on::after{content:'';position:absolute;margin-top:26px;width:4px;height:4px;border-radius:50%;background:var(--accent2)}
  .ctrl.big{
    width:46px;height:46px;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 6px 20px rgba(124,92,255,.5);
  }
  .ctrl.big svg{width:22px;height:22px}
  .ctrl.big:hover{transform:scale(1.07);background:linear-gradient(135deg,var(--accent),var(--accent2))}

  .seek{display:flex;align-items:center;gap:10px}
  .time{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:center}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:5px;border-radius:99px;cursor:pointer;outline:none;
    background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.14) var(--p,0%));
    transition:height .15s;
  }
  input[type=range]:hover{height:7px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 4px rgba(124,92,255,.28);transition:transform .15s;
  }
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25)}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:0;border-radius:50%;background:#fff;
    box-shadow:0 0 0 4px rgba(124,92,255,.28);
  }
  input[type=range]::-moz-range-track{background:transparent}

  .right{display:flex;align-items:center;gap:10px;justify-content:flex-end}
  .right input[type=range]{flex:none;width:100px}

  /* ---------- Video modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:grid;place-items:center;padding:20px;
    background:rgba(4,4,10,.88);
    backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .modal.open{opacity:1;pointer-events:auto}
  .modal-box{
    width:min(1000px,100%);
    background:#0f0f18;
    border:1px solid var(--border);
    border-radius:18px;overflow:hidden;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.95);
    transform:scale(.94) translateY(14px);transition:.35s cubic-bezier(.2,.8,.3,1);
  }
  .modal.open .modal-box{transform:none}
  .modal-box video{width:100%;display:block;background:#000;aspect-ratio:16/9}
  .modal-bar{display:flex;align-items:center;gap:14px;padding:16px 20px}
  .modal-bar h3{font-size:1.05rem;flex:1;min-width:0}
  .modal-bar p{font-size:.8rem;color:var(--muted);margin-top:3px}
  .close{
    border:0;cursor:pointer;flex:none;
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.08);color:var(--text);
    display:grid;place-items:center;transition:.25s;
  }
  .close svg{width:18px;height:18px;fill:currentColor}
  .close:hover{background:var(--accent2);transform:rotate(90deg)}

  /* ---------- Responsive ---------- */
  @media(max-width:900px){
    .player{grid-template-columns:1fr auto;gap:10px}
    .player .now{grid-column:1/2}
    .player .right{display:none}
    .player .center{grid-column:1/-1}
  }
  @media(max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
    .logo span{display:none}
    .search input{width:150px}
    .search input:focus{width:170px}
    .cover{font-size:2rem}
    .now .art{width:44px;height:44px;font-size:1.2rem}
  }
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <span>Pulse</span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="music">Music</button>
    <button class="tab" data-tab="videos">Videos</button>
  </nav>

  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="search" id="search" placeholder="Search music or videos…" autocomplete="off" />
  </div>
</header>

<!-- ============ MAIN ============ -->
<main>
  <!-- MUSIC -->
  <section class="panel active" id="panel-music">
    <div class="section-head">
      <h2>Trending Tracks</h2>
      <span class="pill" id="musicCount">8 songs</span>
    </div>
    <div class="grid" id="musicGrid"></div>
  </section>

  <!-- VIDEOS -->
  <section class="panel" id="panel-videos">
    <div class="section-head">
      <h2>Video Gallery</h2>
      <span class="pill" id="videoCount">6 videos</span>
    </div>
    <div class="grid" id="videoGrid"></div>
  </section>
</main>

<!-- ============ PLAYER BAR ============ -->
<div class="player" id="player">
  <div class="now">
    <div class="art" id="art">🎵</div>
    <div class="now-info">
      <h4 id="npTitle">Nothing playing</h4>
      <span id="npArtist">Pick a track to start</span>
    </div>
    <div class="eq"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="center">
    <div class="controls">
      <button class="ctrl" id="shuffleBtn" title="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl big" id="playBtn" title="Play / Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
      </button>
      <button class="ctrl" id="repeatBtn" title="Repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <div class="seek">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
      <span class="time" id="durTime">0:00</span>
    </div>
  </div>

  <div class="right">
    <button class="ctrl" id="muteBtn" title="Mute">
      <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume" />
  </div>
</div>

<!-- ============ VIDEO MODAL ============ -->
<div class="modal" id="modal">
  <div class="modal-box">
    <video id="modalVideo" controls playsinline preload="metadata"></video>
    <div class="modal-bar">
      <div style="flex:1;min-width:0">
        <h3 id="modalTitle">—</h3>
        <p id="modalMeta">—</p>
      </div>
      <button class="close" id="closeModal" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const TRACKS = [
  { t:"Neon Horizon",   a:"Aurora Skies",  e:"🌆", c:"linear-gradient(135deg,#7c5cff,#ff4d8d)", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
  { t:"Midnight Drive", a:"The Velvet Owls", e:"🌙", c:"linear-gradient(135deg,#2ec4b6,#0b3d5c)", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
  { t:"Solar Flare",    a:"Kilo Nova",     e:"☀️", c:"linear-gradient(135deg,#ff9f1c,#e63946)", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
  { t:"Deep Current",   a:"Marina Blue",   e:"🌊", c:"linear-gradient(135deg,#4361ee,#4cc9f0)", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
  { t:"Paper Planes",   a:"Lo-Fi Cabin",   e:"✈️", c:"linear-gradient(135deg,#f72585,#7209b7)", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
  { t:"Electric Bloom", a:"Synthetix",     e:"🌸", c:"linear-gradient(135deg,#06d6a0,#118ab2)", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" },
  { t:"Golden Static",  a:"Rae Monroe",    e:"✨", c:"linear-gradient(135deg,#ffd166,#ef476f)", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" },
  { t:"Afterglow",      a:"Nova & Co.",    e:"🔥", c:"linear-gradient(135deg,#8338ec,#3a86ff)", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" }
];

const BASE = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/";
const VIDEOS = [
  { t:"Big Buck Bunny",        tag:"Animation", dur:"9:56", e:"🐰", c:"linear-gradient(135deg,#43aa8b,#254441)", src:BASE+"BigBuckBunny.mp4",        img:BASE+"images/BigBuckBunny.jpg" },
  { t:"Elephants Dream",       tag:"Sci-Fi",    dur:"10:53", e:"🐘", c:"linear-gradient(135deg,#577590,#1d3557)", src:BASE+"ElephantsDream.mp4",      img:BASE+"images/ElephantsDream.jpg" },
  { t:"For Bigger Blazes",     tag:"Action",    dur:"0:15", e:"🔥", c:"linear-gradient(135deg,#e63946,#6a040f)", src:BASE+"ForBiggerBlazes.mp4",     img:BASE+"images/ForBiggerBlazes.jpg" },
  { t:"For Bigger Escapes",    tag:"Adventure", dur:"0:15", e:"🏔️", c:"linear-gradient(135deg,#f4a261,#264653)", src:BASE+"ForBiggerEscapes.mp4",    img:BASE+"images/ForBiggerEscapes.jpg" },
  { t:"Sintel",                tag:"Fantasy",   dur:"14:48", e:"🐉", c:"linear-gradient(135deg,#7209b7,#3a0ca3)", src:BASE+"Sintel.mp4",              img:BASE+"images/Sintel.jpg" },
  { t:"Tears of Steel",        tag:"Sci-Fi",    dur:"12:14", e:"🤖", c:"linear-gradient(135deg,#118ab2,#073b4c)", src:BASE+"TearsOfSteel.mp4",        img:BASE+"images/TearsOfSteel.jpg" }
];

/* =========================================================
   ELEMENTS
   ========================================================= */
const $ = id => document.getElementById(id);
const musicGrid = $('musicGrid');
const videoGrid = $('videoGrid');
const player    = $('player');
const audio     = new Audio();
audio.preload   = 'metadata';

let currentIndex = -1;
let shuffle = false;
let repeat   = 'off';   // 'off' | 'all' | 'one'
let isSeeking = false;

/* =========================================================
   RENDER
   ========================================================= */
function renderMusic(query = '') {
  const q = query.trim().toLowerCase();
  const rows = TRACKS
    .map((t, i) => ({ t, i }))
    .filter(({ t }) => !q || t.t.toLowerCase().includes(q) || t.a.toLowerCase().includes(q));

  if (!rows.length) {
    musicGrid.innerHTML = `<div class="empty">No tracks match “${escapeHtml(query)}”.</div>`;
  } else {
    musicGrid.innerHTML = rows.map(({ t, i }) => `
      <article class="card ${i === currentIndex ? 'active' : ''}" data-index="${i}">
        <div class="cover" style="background:${t.c}">
          <span>${t.e}</span>
          <button class="play-btn" aria-label="Play ${escapeHtml(t.t)}">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
        <h3>${escapeHtml(t.t)}</h3>
        <p>${escapeHtml(t.a)}</p>
      </article>`).join('');
  }
  $('musicCount').textContent = rows.length + (rows.length === 1 ? ' song' : ' songs');
}

function renderVideos(query = '') {
  const q = query.trim().toLowerCase();
  const rows = VIDEOS
    .map((v, i) => ({ v, i }))
    .filter(({ v }) => !q || v.t.toLowerCase().includes(q) || v.tag.toLowerCase().includes(q));

  if (!rows.length) {
    videoGrid.innerHTML = `<div class="empty">No videos match “${escapeHtml(query)}”.</div>`;
  } else {
    videoGrid.innerHTML = rows.map(({ v, i }) => `
      <article class="card v-card" data-vindex="${i}">
        <div class="thumb" style="background:${v.c}">
          <span>${v.e}</span>
          <img src="${v.img}" alt="" loading="lazy"
               onerror="this.style.display='none'">
          <div class="play-overlay"><div>
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div></div>
          <span class="badge">${v.dur}</span>
        </div>
        <h3>${escapeHtml(v.t)}</h3>
        <div class="v-meta"><span class="tag">${escapeHtml(v.tag)}</span></div>
      </article>`).join('');
  }
  $('videoCount').textContent = rows.length + (rows.length === 1 ? ' video' : ' videos');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* =========================================================
   AUDIO PLAYBACK
   ========================================================= */
function playTrack(index) {
  if (index < 0) index = TRACKS.length - 1;
  if (index >= TRACKS.length) index = 0;

  currentIndex = index;
  const track = TRACKS[index];

  audio.src = track.src;
  player.classList.add('show');

  const p = audio.play();
  if (p) p.catch(err => console.warn('Playback blocked:', err.message));

  updateNowPlaying();
  markActiveCard();
}

function updateNowPlaying() {
  const t = TRACKS[currentIndex];
  if (!t) return;
  $('art').style.background = t.c;
  $('art').textContent = t.e;
  $('npTitle').textContent  = t.t;
  $('npArtist').textContent = t.a;
}

function markActiveCard() {
  musicGrid.querySelectorAll('.card').forEach(card => {
    card.classList.toggle('active', Number(card.dataset.index) === currentIndex);
  });
}

function togglePlay() {
  if (currentIndex === -1) { playTrack(0); return; }
  if (audio.paused) {
    const p = audio.play();
    if (p) p.catch(() => {});
  } else {
    audio.pause();
  }
}

function nextTrack(auto = false) {
  if (repeat === 'one' && auto) { audio.currentTime = 0; audio.play().catch(()=>{}); return; }
  if (shuffle && TRACKS.length > 1) {
    let i;
    do { i = Math.floor(Math.random() * TRACKS.length); } while (i === currentIndex);
    playTrack(i);
    return;
  }
  const next = currentIndex + 1;
  if (next >= TRACKS.length) {
    if (repeat === 'all' || !auto) playTrack(0);
    else { audio.pause(); updatePlayIcon(); }
    return;
  }
  playTrack(next);
}

function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  playTrack(currentIndex - 1);
}

/* =========================================================
   AUDIO EVENTS
   ========================================================= */
audio.addEventListener('play',  updatePlayIcon);
audio.addEventListener('pause', updatePlayIcon);

audio.addEventListener('loadedmetadata', () => {
  $('durTime').textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (isSeeking || !audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 1000;
  const seek = $('seek');
  seek.value = pct;
  seek.style.setProperty('--p', (pct / 10) + '%');
  $('curTime').textContent = formatTime(audio.currentTime);
});

audio.addEventListener('ended', () => nextTrack(true));

audio.addEventListener('error', () => {
  $('npArtist').textContent = '⚠ Could not load this track';
});

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updatePlayIcon() {
  const playing = !audio.paused && currentIndex !== -1;
  $('playIcon').innerHTML = playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  player.classList.toggle('playing', playing);
}

/* =========================================================
   CONTROLS
   ========================================================= */
$('playBtn').addEventListener('click', togglePlay);
$('nextBtn').addEventListener('click', () => nextTrack(false));
$('prevBtn').addEventListener('click', prevTrack);

$('shuffleBtn').addEventListener('click', e => {
  shuffle = !shuffle;
  e.currentTarget.classList.toggle('on', shuffle);
});

$('repeatBtn').addEventListener('click', e => {
  repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
  e.currentTarget.classList.toggle('on', repeat !== 'off');
  e.currentTarget.title = 'Repeat: ' + repeat;
});

/* seek */
const seek = $('seek');
seek.addEventListener('input', () => {
  isSeeking = true;
  seek.style.setProperty('--p', (seek.value / 10) + '%');
  if (audio.duration) {
    $('curTime').textContent = formatTime((seek.value / 1000) * audio.duration);
  }
});
seek.addEventListener('change', () => {
  if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration;
  isSeeking = false;
});

/* volume */
const volume = $('volume');
audio.volume = volume.value / 100;
volume.style.setProperty('--p', volume.value + '%');

volume.addEventListener('input', () => {
  audio.volume = volume.value / 100;
  audio.muted = false;
  volume.style.setProperty('--p', volume.value + '%');
  updateVolIcon();
});

$('muteBtn').addEventListener('click', () => {
  audio.muted = !audio.muted;
  updateVolIcon();
});

function updateVolIcon() {
  const off = audio.muted || audio.volume === 0;
  $('volIcon').innerHTML = off
    ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>'
    : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
}

/* =========================================================
   GRID CLICKS (delegated)
   ========================================================= */
musicGrid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  playTrack(Number(card.dataset.index));
});

videoGrid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  openVideo(Number(card.dataset.vindex));
});

/* =========================================================
   VIDEO MODAL
   ========================================================= */
const modal = $('modal');
const modalVideo = $('modalVideo');

function openVideo(i) {
  const v = VIDEOS[i];
  if (!v) return;

  if (!audio.paused) audio.pause();        // stop music while watching
  $('modalTitle').textContent = v.t;
  $('modalMeta').textContent  = `${v.tag} · ${v.dur}`;
  modalVideo.src = v.src;
  modalVideo.poster = v.img;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalVideo.play().catch(() => {});
}

function closeVideo() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
  modalVideo.pause();
  modalVideo.removeAttribute('src');
  modalVideo.load();
}

$('closeModal').addEventListener('click', closeVideo);
modal.addEventListener('click', e => { if (e.target === modal) closeVideo(); });

/* =========================================================
   TABS + SEARCH
   ========================================================= */
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + btn.dataset.tab);
  });
  $('search').value = '';
  renderMusic(); renderVideos();
});

$('search').addEventListener('input', e => {
  const q = e.target.value;
  renderMusic(q);
  renderVideos(q);
});

/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);

  if (e.key === 'Escape' && modal.classList.contains('open')) { closeVideo(); return; }
  if (typing) return;

  if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight')  { if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); }
  if (e.key === 'ArrowLeft')   { if (audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 5); }
  if (e.key === 'ArrowUp')     { e.preventDefault(); volume.value = Math.min(100, +volume.value + 5); volume.dispatchEvent(new Event('input')); }
  if (e.key === 'ArrowDown')   { e.preventDefault(); volume.value = Math.max(0, +volume.value - 5);   volume.dispatchEvent(new Event('input')); }
  if (e.key.toLowerCase() === 'n') nextTrack(false);
  if (e.key.toLowerCase() === 'p') prevTrack();
});

/* =========================================================
   INIT
   ========================================================= */
renderMusic();
renderVideos();
updateVolIcon();
$('seek').style.setProperty('--p', '0%');
</script>
</body>
</html>
